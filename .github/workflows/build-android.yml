name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls $ANDROID_HOME/cmdline-tools/ || echo "cmdline-tools not found"
          ls $ANDROID_HOME/build-tools/ || echo "build-tools not found at default"

      - name: Accept SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || \
          yes | $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager --licenses 2>/dev/null || \
          true

      - name: Install SDK components
        run: |
          SDK_MGR=$(find $ANDROID_HOME/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SDK_MGR" ]; then
            "$SDK_MGR" "build-tools;34.0.0" "platforms;android-34"
          else
            echo "sdkmanager not found, skipping"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Print signing fingerprint
        working-directory: android
        run: |
          echo "==== SHA-256 fingerprint (copy to assetlinks.json) ===="
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk 2>/dev/null \
            | grep -i "SHA256" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: C4Person-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
